[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptosec-toolkit"
version = "0.1.0"
description = "Comprehensive Cryptographic Toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
    "bcrypt>=4.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "bandit>=1.7.5",
]
